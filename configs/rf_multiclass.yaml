# ─────────────────────────────────────────────────────────────────────────────
# vegclassifier — experiment config
#
# This file fully defines a run. Commit it alongside results and the run is
# reproducible. Copy it per experiment (rf_binary.yaml, svm_merged.yaml, ...).
#
# Defaults below are the values locked in notebooks 02_B and 03_B.
# ─────────────────────────────────────────────────────────────────────────────

# binary     = Background vs Phragmites (FAV/Tule excluded from training)
# multiclass = Background, Phragmites, FAV, Tule
# merged     = BG+Tule (both "leave alone"), Phragmites, FAV
scope: multiclass

paths:
  # Data lives OUTSIDE the repo. These are relative to the repo root; adjust if
  # your checkout sits elsewhere.
  tile_dir:   ../WinterIsland_2025_Drone_Tiles      # tiles: TRAINING only
  image_dir:  ../WinterIsland_2025_Drone_Imagery    # full orthomosaics: predict + evaluate
  data_dir:   ../WinterIsland_shapefiles
  output_dir: models                                # trained .joblib bundles

  # Tile layout on disk:
  #   <tile_dir>/rgb_images/<site>/<stem>.tif
  #   <tile_dir>/class_masks/<site>/<stem>_mask.tif
  image_subdir: rgb_images
  mask_subdir:  class_masks
  mask_suffix:  _mask

normalization:
  # identity won 28 of 36 channel x pair combinations in 02_B. per_tile is
  # actively harmful (destroys absolute colour information) — avoid.
  mode: identity                # identity | global | per_tile
  lo: 0.0
  hi: 255.0

features:
  # The validated 4-feature stack: Hue, Saturation, Entropy(Sat), GLCM-Contrast(Sat).
  # All pairwise correlations < 0.7. Changing these invalidates 02_B's findings.
  entropy_r:         61         # 6.1 m — 02_B section 5.4 extended sweep
  glcm_patch_size:   21         # 2.1 m — 02_B section 5.2
  glcm_levels:       64
  glcm_distances:    [1, 3, 5]
  nonveg_val_thresh: 0.35       # Val < 0.35 AND Sat < 0.35 -> non-vegetated
  nonveg_sat_thresh: 0.35

sampling:
  max_px_per_tile: 2000         # per class per tile — balances the pool
  erode_px:        10           # ~1 m; strips ambiguous polygon edges
  seed:            42

model:
  algo: rf                     # gm | gmm | rf | svm

  # RandomForest
  rf_n_estimators:     300
  rf_max_depth:        null
  rf_min_samples_leaf: 5
  rf_max_features:     sqrt
  rf_class_weight:     balanced

  # SVM (single-threaded; subsamples above svm_max_train)
  svm_C:            1.0
  svm_gamma:        scale
  svm_max_train:    40000
  svm_class_weight: balanced

  # GMM — Background gets 2 components for its known bimodality, others 1
  gmm_bg_components: 2