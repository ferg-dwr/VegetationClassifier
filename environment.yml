# Conda environment for vegclassifier.
#
#   conda env create -f environment.yml
#   conda activate invasives
#   pip install -e .
#
# Conda (not pip) is used for the geospatial stack: rasterio and geopandas
# depend on GDAL/GEOS/PROJ system libraries that conda-forge ships as prebuilt
# binaries. Installing these through pip is a common source of setup failures.
#
# Versions are floored, not exact-pinned, so conda can still solve across
# platforms. To reproduce a known-good environment byte-for-byte, run
#   conda env export > environment.lock.yml
# on a working machine and share that instead.

name: invasives

channels:
  - conda-forge

dependencies:
  - python >=3.11,<3.15

  # numerical / data
  - numpy >=1.26
  - scipy >=1.11
  - pandas >=2.0

  # geospatial (GDAL-backed — install via conda, not pip)
  - rasterio >=1.3
  - geopandas >=0.14
  - shapely >=2.0

  # imaging / ML
  - scikit-image >=0.22
  - scikit-learn >=1.3
  - joblib >=1.3

  # config / notebooks
  - pyyaml >=6.0
  - matplotlib >=3.7
  - jupyterlab

  - pip